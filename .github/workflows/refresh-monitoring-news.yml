name: Refresh monitored news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/watchlist.json"
      - "config/publisher-links.json"
      - "scripts/sync-media-feed.mjs"
      - "src/index.js"
      - ".github/workflows/refresh-monitoring-news.yml"

permissions:
  contents: write

concurrency:
  group: refresh-monitoring-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and filter monitoring news
        run: node scripts/sync-media-feed.mjs

      - name: Commit a changed snapshot
        run: |
          if git diff --quiet -- dist/data/monitoring-news.json; then
            echo "監測資料沒有變更，不建立提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/monitoring-news.json
          git commit -m "chore: refresh monitored news"
          git push
